name: Build Baseline
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  BuildBaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply mihomo patches
        run: |
          cd core/src/foss/golang/clash
          patch -p1 < "$GITHUB_WORKSPACE/.github/mihomo-patches/rejectbuf.patch"
          grep -q "FEATURE-REJECTBUF" adapter/outbound/reject.go

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Ensure NDK
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi

      - name: Write local.properties
        run: |
          printf 'sdk.dir=%s\ncustom.application.id=com.lu.clashfirewall\nremove.suffix=true\n' "$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: ClashFirewall Baseline Debug APK
          path: |
            app/build/outputs/apk/alpha/debug/*.apk
